# Joule Configuration
# Copy to joule.config.yaml and customize

providers:
  ollama:
    enabled: true
    baseUrl: "http://localhost:11434"
    models:
      slm: "llama3.2:3b"

  anthropic:
    enabled: true
    # apiKey: set via JOULE_ANTHROPIC_API_KEY env var
    models:
      slm: "claude-haiku-3.5"
      llm: "claude-sonnet-4-20250514"

  openai:
    enabled: false
    # apiKey: set via JOULE_OPENAI_API_KEY env var
    models:
      slm: "gpt-4o-mini"
      llm: "gpt-4o"

  google:
    enabled: false
    # apiKey: set via JOULE_GOOGLE_API_KEY env var
    models:
      slm: "gemini-2.5-flash"
      llm: "gemini-2.5-pro"

budgets:
  default: "medium"

routing:
  preferLocal: true
  slmConfidenceThreshold: 0.6
  complexityThreshold: 0.7
  preferEfficientModels: false
  energyWeight: 0
  providerPriority:
    slm: ["ollama", "google", "openai", "anthropic"]
    llm: ["anthropic", "openai", "google"]
  # Execution mode when a task does not set one:
  #   adaptive      SLM-first step agent + escalation policy (continue / consult / handoff / abort) — default
  #   slm-only      step agent pinned to the small model
  #   mid-only      step agent pinned to the middle rung (models.mid)
  #   llm-only      step agent pinned to the large model
  #   static-router legacy plan-then-execute pipeline
  defaultMode: adaptive
  # Rule-based escalation policy for adaptive execution (all optional)
  escalation:
    maxSteps: 25
    consultThreshold: 0.55
    handoffThreshold: 0.35
    maxFailuresBeforeHandoff: 3
    maxConsultations: 3
    consultMaxTokens: 800
    stallSteps: 3
    verifyRetries: 1
    failureWindow: 6            # only failures in the last N steps count as "stuck"
    consultMode: patch          # patch: the advisor may return a concrete file edit; advice: prose only
    staticChecks: true          # compile-check written Python files right away
    observationChars: 1500      # characters of a tool result shown to the agent
    # ladder: [slm, mid, llm]   # rungs to use; a provider's models.mid enables the middle rung
    # verification: none        # ablation only: disable the step verifier
    # confidenceSource: self-report   # ablation only: use the model's own confidence claim

# Energy tracking configuration
energy:
  enabled: true
  gridCarbonIntensity: 400       # gCO2/kWh (global average)
  localModelCarbonIntensity: 0   # gCO2/kWh for local models (0 = user's own power)
  includeInRouting: false        # set true to factor energy into model selection
  energyWeight: 0.3              # 0-1: how much energy matters vs capability

tools:
  builtinEnabled: true
  pluginDirs: []
  disabledTools: []

logging:
  level: "info"
  traceOutput: "memory"

server:
  port: 3927
  host: "127.0.0.1"
